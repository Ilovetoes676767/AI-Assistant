<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mini FPS</title>
  <style>
    :root{
      --bg:#050a12;
      --panel:rgba(10,14,20,0.75);
      --text:#dfefff;
      --accent:#7fe7ff;
      --danger:#ff5d5d;
      --gold:#ffd166;
    }

    * { box-sizing: border-box; }
    html, body {
      margin:0;
      width:100%;
      height:100%;
      background:var(--bg);
      color:var(--text);
      font-family: Arial, Helvetica, sans-serif;
      overflow:hidden;
    }

    body{
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .game-wrap{
      position:relative;
      width:min(96vw, 1200px);
      height:min(94vh, 720px);
      border:1px solid rgba(127,231,255,0.2);
      background:#0a1220;
      box-shadow:0 0 30px rgba(127,231,255,0.1);
      overflow:hidden;
    }

    canvas{
      display:block;
      width:100%;
      height:100%;
      background: #050b12;
      cursor: crosshair;
    }

    .hud{
      position:absolute;
      top:18px;
      left:18px;
      right:18px;
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      pointer-events:none;
      z-index:5;
      gap:12px;
    }

    .panel{
      background:rgba(11,15,22,0.56);
      border:1px solid rgba(255,255,255,0.08);
      border-radius:12px;
      padding:10px 12px;
      backdrop-filter: blur(2px);
      min-width: 180px;
    }

    .title{
      font-weight:700;
      letter-spacing:0.15em;
      text-transform:uppercase;
      color:var(--accent);
      font-size:12px;
      margin-bottom:6px;
    }

    .stat{
      display:flex;
      justify-content:space-between;
      gap:26px;
      margin-top:2px;
      font-size:13px;
      color:#eaf7ff;
    }

    .right{
      text-align:right;
    }

    .crosshair{
      position:absolute;
      left:50%;
      top:50%;
      width:18px;
      height:18px;
      transform:translate(-50%,-50%);
      pointer-events:none;
      z-index:10;
    }

    .crosshair::before,
    .crosshair::after{
      content:"";
      position:absolute;
      background:rgba(255,255,255,0.8);
      box-shadow:0 0 8px rgba(127,231,255,.5);
    }

    .crosshair::before{
      left:50%; top:-2px; width:2px; height:22px; transform:translateX(-50%);
    }
    .crosshair::after{
      top:50%; left:-2px; width:22px; height:2px; transform:translateY(-50%);
    }
  </style>
</head>
<body>
  <div class="game-wrap">
    <div class="hud">
      <div class="panel">
        <div class="title">Stats</div>
        <div class="stat"><span>Health</span><span id="health">100</span></div>
        <div class="stat"><span>Ammo</span><span id="ammo">12 / 12</span></div>
        <div class="stat"><span>Enemies</span><span id="enemies">0</span></div>
      </div>

      <div class="panel right">
        <div class="title">Mission</div>
        <div class="stat"><span>Score</span><span id="score">0</span></div>
        <div class="stat"><span>Objective</span><span id="objective">Clear the base</span></div>
        <div class="stat"><span>Status</span><span id="status">Live</span></div>
      </div>
    </div>

    <div class="crosshair"></div>

    <canvas id="game" width="1200" height="720"></canvas>
  </div>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    const healthEl = document.getElementById("health");
    const ammoEl = document.getElementById("ammo");
    const enemiesEl = document.getElementById("enemies");
    const scoreEl = document.getElementById("score");
    const objectiveEl = document.getElementById("objective");
    const statusEl = document.getElementById("status");

    const map = [
      "################",
      "#..............#",
      "#..#....#......#",
      "#..#....#......#",
      "#..#....#......#",
      "#..#...........#",
      "#......##......#",
      "#..............#",
      "#......#........#",
      "#......#........#",
      "#......#.......##",
      "#......#........#",
      "#..............#",
      "#....#....#....##",
      "#..............#",
      "################"
    ];

    const mapW = map[0].length;
    const mapH = map.length;

    const keyState = {};
    const mouse = { down: false };

    let lastTime = 0;
    let shotCooldown = 0;
    let reloadTimer = 0;

    const player = {
      x: 2.5,
      y: 2.5,
      angle: 0,
      radius: 0.18,
      health: 100,
      ammo: 12,
      maxAmmo: 12,
      score: 0,
      alive: true
    };

    const enemies = [];

    function randomCell() {
      let x, y;
      do {
        x = Math.floor(Math.random() * (mapW - 2)) + 1;
        y = Math.floor(Math.random() * (mapH - 2)) + 1;
      } while (map[y][x] !== ".");
      return { x: x + 0.5, y: y + 0.5 };
    }

    function spawnEnemies(count) {
      enemies.length = 0;
      for (let i = 0; i < count; i++) {
        const pos = randomCell();
        enemies.push({
          x: pos.x,
          y: pos.y,
          hp: 2,
          speed: 0.7 + Math.random() * 0.75,
          attackCooldown: 0,
          angle: Math.random() * Math.PI * 2
        });
      }
      refreshHud();
    }

    function clamp(v, min, max) {
      return Math.min(max, Math.max(min, v));
    }

    function isWall(x, y) {
      const gridX = Math.floor(x);
      const gridY = Math.floor(y);
      if (gridX < 0 || gridY < 0 || gridX >= mapW || gridY >= mapH) return true;
      return map[gridY][gridX] === "#";
    }

    function movePlayer(dt) {
      if (!player.alive) return;

      let xMove = 0;
      let yMove = 0;
      const forward = (keyState["w"] || keyState["ArrowUp"] ? 1 : 0) - (keyState["s"] || keyState["ArrowDown"] ? 1 : 0);
      const strafe = (keyState["d"] ? 1 : 0) - (keyState["a"] ? 1 : 0);

      const speed = 2.4 * dt;

      if (forward !== 0 || strafe !== 0) {
        const dx = Math.cos(player.angle) * forward - Math.sin(player.angle) * strafe;
        const dy = Math.sin(player.angle) * forward + Math.cos(player.angle) * strafe;
        const len = Math.hypot(dx, dy) || 1;

        xMove = (dx / len) * speed;
        yMove = (dy / len) * speed;
      }

      const newX = player.x + xMove;
      const newY = player.y + yMove;

      if (!isWall(newX + player.radius, player.y)) player.x = newX;
      if (!isWall(player.x, newY + player.radius)) player.y = newY;

      if (keyState["q"]) player.angle -= 2.6 * dt;
      if (keyState["e"]) player.angle += 2.6 * dt;
    }

    function shoot() {
      if (!player.alive || reloadTimer > 0) return;
      if (shotCooldown > 0) return;
      if (player.ammo <= 0) {
        reloadWeapon();
        return;
      }

      player.ammo -= 1;
      shotCooldown = 0.22;

      let bestEnemy = null;
      let bestScore = 9999;

      for (const enemy of enemies) {
        const dx = enemy.x - player.x;
        const dy = enemy.y - player.y;
        const dist = Math.hypot(dx, dy);

        if (dist > 7) continue;

        let ang = Math.atan2(dy, dx) - player.angle;
        while (ang < -Math.PI) ang += Math.PI * 2;
        while (ang > Math.PI) ang -= Math.PI * 2;

        if (Math.abs(ang) < 0.18 && dist < bestScore) {
          bestScore = dist;
          bestEnemy = enemy;
        }
      }

      if (bestEnemy) {
        bestEnemy.hp -= 1;
        if (bestEnemy.hp <= 0) {
          player.score += 10;
          removeEnemy(bestEnemy);
        }
      }

      refreshHud();
    }

    function removeEnemy(enemy) {
      const idx = enemies.indexOf(enemy);
      if (idx >= 0) enemies.splice(idx, 1);
      if (enemies.length === 0) {
        objectiveEl.textContent = "Area cleared";
        statusEl.textContent = "Secure";
        setTimeout(() => {
          spawnEnemies(7);
          objectiveEl.textContent = "Clear the base";
          statusEl.textContent = "Live";
        }, 1000);
      }
    }

    function reloadWeapon() {
      if (player.ammo >= player.maxAmmo || reloadTimer > 0) return;
      reloadTimer = 1.1;
      statusEl.textContent = "Reloading";
    }

    function updateWeapons(dt) {
      if (shotCooldown > 0) shotCooldown -= dt;
      if (reloadTimer > 0) {
        reloadTimer -= dt;
        if (reloadTimer <= 0) {
          player.ammo = player.maxAmmo;
          statusEl.textContent = "Live";
          refreshHud();
        }
      }
    }

    function updateEnemies(dt) {
      for (const enemy of enemies) {
        const dx = player.x - enemy.x;
        const dy = player.y - enemy.y;
        const dist = Math.hypot(dx, dy);

        if (dist < 0.35) {
          if (enemy.attackCooldown <= 0) {
            player.health -= 12;
            enemy.attackCooldown = 1.1;
            if (player.health <= 0) {
              player.alive = false;
              statusEl.textContent = "Down";
              objectiveEl.textContent = "Mission failed";
            }
          }
        } else {
          const targetAngle = Math.atan2(dy, dx);
          let diff = targetAngle - enemy.angle;
          while (diff < -Math.PI) diff += Math.PI * 2;
          while (diff > Math.PI) diff -= Math.PI * 2;

          if (Math.abs(diff) > 0.2) {
            enemy.angle += Math.sign(diff) * 2.2 * dt;
          }

          if (dist > 1.3 && Math.abs(diff) < 0.9) {
            const step = enemy.speed * dt;
            const nx = enemy.x + Math.cos(enemy.angle) * step;
            const ny = enemy.y + Math.sin(enemy.angle) * step;
            if (!isWall(nx + 0.2, enemy.y)) enemy.x = nx;
            if (!isWall(enemy.x, ny + 0.2)) enemy.y = ny;
          }
        }

        enemy.attackCooldown = Math.max(0, enemy.attackCooldown - dt);
      }

      refreshHud();
    }

    function castRay(x, y, angle) {
      const sin = Math.sin(angle);
      const cos = Math.cos(angle);

      let distance = 0;
      const step = 0.02;

      while (distance < 18) {
        const tx = x + cos * distance;
        const ty = y + sin * distance;
        if (isWall(tx, ty)) {
          return distance;
        }
        distance += step;
      }
      return 18;
    }

    function drawBackground() {
      const sky = ctx.createLinearGradient(0, 0, 0, canvas.height / 2);
      sky.addColorStop(0, "#0d1631");
      sky.addColorStop(1, "#2b4d6b");
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, canvas.width, canvas.height / 2);

      const floor = ctx.createLinearGradient(0, canvas.height / 2, 0, canvas.height);
      floor.addColorStop(0, "#252b2d");
      floor.addColorStop(1, "#0d0f11");
      ctx.fillStyle = floor;
      ctx.fillRect(0, canvas.height / 2, canvas.width, canvas.height / 2);
    }

    function drawWalls() {
      const fov = Math.PI / 3;
      const numRays = 240;
      const step = fov / numRays;

      for (let i = 0; i < numRays; i++) {
        const angle = player.angle - fov / 2 + i * step;
        const dist = castRay(player.x, player.y, angle);

        const wallHeight = clamp((canvas.height / dist) * 0.78, 0, canvas.height);
        const yTop = (canvas.height - wallHeight) / 2;
        const shade = clamp(1 - dist / 18, 0.1, 1);

        ctx.fillStyle = `rgba(${Math.floor(100 + 100 * shade)}, ${Math.floor(90 + 90 * shade)}, ${Math.floor(100 + 100 * shade)}, 1)`;
        ctx.fillRect((canvas.width / numRays) * i, yTop, canvas.width / numRays + 1, wallHeight);
      }
    }

    function drawSprites() {
      const visible = [];

      for (const enemy of enemies) {
        const dx = enemy.x - player.x;
        const dy = enemy.y - player.y;
        const dist = Math.hypot(dx, dy);

        if (dist < 0.5) continue;

        let ang = Math.atan2(dy, dx) - player.angle;
        while (ang < -Math.PI) ang += Math.PI * 2;
        while (ang > Math.PI) ang -= Math.PI * 2;

        const fov = Math.PI / 3;
        if (Math.abs(ang) < fov * 1.2) {
          visible.push({ enemy, dist, ang });
        }
      }

      visible.sort((a, b) => b.dist - a.dist);

      for (const { enemy, dist, ang } of visible) {
        const screenX = (0.5 + ang / (Math.PI / 3)) * canvas.width;
        const size = clamp((canvas.height * 0.9) / dist, 18, 220);
        const yCenter = canvas.height / 2;

        const sprite = {
          x: screenX - size / 2,
          y: yCenter - size / 2,
          size
        };

        const hpRatio = enemy.hp / 2;
        ctx.fillStyle = "rgba(255, 80, 80, 0.85)";
        ctx.fillRect(sprite.x, sprite.y + size + 8, size, 6);

        ctx.fillStyle = "rgba(120, 255, 160, 0.9)";
        ctx.fillRect(sprite.x, sprite.y + size + 8, size * hpRatio, 6);

        ctx.fillStyle = "#dfefff";
        ctx.beginPath();
        ctx.arc(screenX, yCenter, size * 0.26, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#ff5d5d";
        ctx.beginPath();
        ctx.arc(screenX - size * 0.12, yCenter - size * 0.08, size * 0.08, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function drawMinimap() {
      const cell = 10;
      const offsetX = 18;
      const offsetY = canvas.height - mapH * cell - 18;

      ctx.fillStyle = "rgba(0,0,0,0.35)";
      ctx.fillRect(offsetX - 4, offsetY - 4, mapW * cell + 8, mapH * cell + 8);

      for (let y = 0; y < mapH; y++) {
        for (let x = 0; x < mapW; x++) {
          ctx.fillStyle = map[y][x] === "#" ? "#dfefff" : "#13263a";
          ctx.fillRect(offsetX + x * cell, offsetY + y * cell, cell, cell);
        }
      }

      const px = offsetX + player.x * cell;
      const py = offsetY + player.y * cell;

      ctx.strokeStyle = "#7fe7ff";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(px, py);
      ctx.lineTo(px + Math.cos(player.angle) * 12, py + Math.sin(player.angle) * 12);
      ctx.stroke();

      ctx.fillStyle = "#ff5d5d";
      ctx.beginPath();
      ctx.arc(px, py, 3, 0, Math.PI * 2);
      ctx.fill();

      for (const enemy of enemies) {
        ctx.fillStyle = "#ffd166";
        ctx.beginPath();
        ctx.arc(offsetX + enemy.x * cell, offsetY + enemy.y * cell, 3, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function refreshHud() {
      healthEl.textContent = Math.max(0, Math.ceil(player.health));
      ammoEl.textContent = `${player.ammo} / ${player.maxAmmo}`;
      enemiesEl.textContent = String(enemies.length);
      scoreEl.textContent = String(player.score);
    }

    function update(dt) {
      if (!player.alive) return;

      const moveSpeed = 2.4;
      const rotSpeed = 2.0;

      if (keyState["ArrowLeft"] || keyState["a"]) player.angle -= rotSpeed * dt;
      if (keyState["ArrowRight"] || keyState["d"]) player.angle += rotSpeed * dt;

      if (keyState["w"]) {
        const nx = player.x + Math.cos(player.angle) * moveSpeed * dt;
        const ny = player.y + Math.sin(player.angle) * moveSpeed * dt;
        if (!isWall(nx + player.radius, player.y)) player.x = nx;
        if (!isWall(player.x, ny + player.radius)) player.y = ny;
      }
      if (keyState["s"]) {
        const nx = player.x - Math.cos(player.angle) * moveSpeed * dt;
        const ny = player.y - Math.sin(player.angle) * moveSpeed * dt;
        if (!isWall(nx + player.radius, player.y)) player.x = nx;
        if (!isWall(player.x, ny + player.radius)) player.y = ny;
      }

      updateWeapons(dt);
      updateEnemies(dt);
      refreshHud();
    }

    function draw() {
      drawBackground();
      drawWalls();
      drawSprites();
      drawMinimap();

      if (!player.alive) {
        ctx.fillStyle = "rgba(0,0,0,0.5)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#fff";
        ctx.textAlign = "center";
        ctx.font = "bold 52px Arial";
        ctx.fillText("Mission Failed", canvas.width / 2, canvas.height / 2 - 18);
        ctx.font = "28px Arial";
        ctx.fillStyle = "#7fe7ff";
        ctx.fillText("Press R to restart", canvas.width / 2, canvas.height / 2 + 30);
      }
    }

    function gameLoop(ts) {
      const dt = Math.min(0.033, (ts - lastTime) / 1000 || 0.016);
      lastTime = ts;

      update(dt);
      draw();

      requestAnimationFrame(gameLoop);
    }

    function resetGame() {
      player.x = 2.5;
      player.y = 2.5;
      player.angle = 0;
      player.health = 100;
      player.ammo = 12;
      player.maxAmmo = 12;
      player.score = 0;
      player.alive = true;
      statusEl.textContent = "Live";
      objectiveEl.textContent = "Clear the base";
      spawnEnemies(7);
      refreshHud();
    }

    window.addEventListener("keydown", (e) => {
      const k = e.key.toLowerCase();
      keyState[k] = true;

      if (e.code === "Space") {
        e.preventDefault();
        shoot();
      }

      if (k === "r" && !player.alive) {
        resetGame();
      }

      if (k === "e") {
        reloadWeapon();
      }
    });

    window.addEventListener("keyup", (e) => {
      keyState[e.key.toLowerCase()] = false;
    });

    canvas.addEventListener("mousedown", () => {
      mouse.down = true;
      shoot();
    });

    canvas.addEventListener("mouseup", () => {
      mouse.down = false;
    });

    setInterval(() => {
      if (mouse.down && player.alive) shoot();
    }, 120);

    resetGame();
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
